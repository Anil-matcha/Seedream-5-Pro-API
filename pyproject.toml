[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seedream-5-pro-api"
version = "0.1.0"
authors = [
  { name="Anil Matcha" },
]
description = "Python SDK for ByteDance's Seedream 5.5 and Seedream 5.0 Pro APIs — image generation, editing, transparent backgrounds, and layer decomposition."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "python-dotenv",
    "mcp[cli]"
]

[tool.setuptools]
py-modules = ["seedream_api", "mcp_server"]
